 <script src="https://unpkg.com/three@0.134.0/build/three.min.js"></script>
 <script src="https://cdn.3dtwins.tech/3dt.js"></script>      


<script>

const buyButton = document.getElementById("buyButton");

let showBuyButton = false;

buyButton.style.display = "none";

try {

  const fullURL = window.location.href;
  const parts = fullURL.split("?");

  if (parts.length >= 2) {

    const params = parts[1];
    const encoded = params.split("=")[1];

    const decoded = atob(decodeURIComponent(encoded));

    const urlObj = new URL(decoded);

    // 1. Check directo en query params
    const buyURLParam = urlObj.searchParams.get("buyURL");

    if (buyURLParam) {
      showBuyButton = true;
    }

    // 2. Check dentro de config (tu caso real más probable)
    const config = urlObj.searchParams.get("config");

    if (config && config.includes("buyURL")) {
      showBuyButton = true;
    }

  }

} catch (err) {

  console.warn("No se pudo verificar buyURL:", err);

}

buyButton.style.display = showBuyButton ? "block" : "none";


buyButton.onclick = function () {

  if (!currentModel) {
    alert("No hay modelo cargado.");
    return;
  }

  const fullURL = window.location.href;
  const parts = fullURL.split("?");

  if (parts.length < 2) {
    alert("No hay parámetros en la URL");
    return;
  }

  const base = parts[0];
  let params = parts[1];

  const newBase = base.replace(
    /https:\/\/[^/]+/,
    "https://product.3dtwins.tech"
  );

  params = params.replace(/^t=/, "scene=");

  try {

    const decoded =
      atob(decodeURIComponent(params.split("=")[1]));

    const urlObj = new URL(decoded);

    const configItems = [];

    currentModel.traverse((child) => {

      if (child.isMesh) {

        const objName = child.name || "unnamed";

        let colorHex = child.userData?.config?.color;

        if (!colorHex && child.material?.color) {
          colorHex =
            "#" + child.material.color.getHexString();
        }

        if (colorHex) {
          configItems.push(`${objName}:${colorHex}`);
        }

      }

    });

    if (configItems.length) {

      urlObj.searchParams.set(
        "config",
        configItems.join("|")
      );

    }

    params =
      "scene=" +
      encodeURIComponent(
        btoa(urlObj.toString())
      );

  } catch (err) {

    console.warn(
      "Error actualizando config:",
      err
    );

  }

  const finalURL = newBase + "?" + params;

  window.location.href = finalURL;

};

</script>
